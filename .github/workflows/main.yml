name: CMCC Checkin
on:
  schedule:
    - cron: '0 1 * * *'  # UTC时间1点 ≈ 北京时间9点签到，可以自己改
  workflow_dispatch: # 支持手动点按钮运行测试

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 执行签到
        env:
          CMCC_COOKIE: ${{ secrets.CMCC_COOKIE }}
        run: python checkin.py
